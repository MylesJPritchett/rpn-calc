[package]
name = "rpn-calc"
version = "0.1.0"
edition = "2021"
description = "A terminal Reverse Polish Notation calculator with undo/redo and a persistent Stack"
repository = "https://github.com/MylesJPritchett/rpn-calc"
license = "MIT"
keywords = ["rpn", "calculator", "tui", "ratatui", "cli"]
categories = ["command-line-utilities", "mathematics"]

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
color-eyre = "0.6.3"
dirs = "7.0.0"

[dev-dependencies]
tempfile = "3.27.0"
